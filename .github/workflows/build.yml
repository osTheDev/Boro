name: Build EBOOT

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Package
        run: mkdir -p dist/PSP/GAME/Boro && cp EBOOT.PBP kernel/boro_kernel.prx dist/PSP/GAME/Boro/
      - uses: actions/upload-artifact@v4
        with:
          name: Boro-EBOOT
          path: dist

  # A pushed v* tag publishes a GitHub release with the zip to copy to the PSP.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Boro-EBOOT
          path: dist
      - name: Zip
        run: cd dist && zip -r "../Boro-${GITHUB_REF_NAME}.zip" PSP
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Boro-${GITHUB_REF_NAME}.zip" --repo "$GITHUB_REPOSITORY" --title "Boro $GITHUB_REF_NAME" --notes "Copy the PSP folder from the zip to the root of your memory stick, then launch Boro from the XMB. Music goes in MUSIC/ (radio-only artists in MUSIC/RADIO/<Artist>/), videos in VIDEO/Movies, VIDEO/Shows or VIDEO/Clips."
