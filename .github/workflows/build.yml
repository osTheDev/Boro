name: Build EBOOT

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Package
        run: mkdir -p dist/PSP/GAME/Boro && cp EBOOT.PBP dist/PSP/GAME/Boro/
      - uses: actions/upload-artifact@v4
        with:
          name: Boro-EBOOT
          path: dist
